[workspace]
resolver = "2"
members = ["crates/ledger-core", "crates/ledger-store", "crates/ledger-config", "crates/ledger-mcp", "crates/ledger-import", "crates/ledger-reader", "crates/ledger-cli", "crates/ledger-gui", "crates/ledger-vault", "crates/ledger-host", "crates/ledger-package"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://git.swaits.com/swaits/wanderbooks"

[workspace.lints.rust]
missing_docs = "warn"
# `cargo kani` sets cfg(kani) for the proof harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# Argon2id at the plan's 64 MiB, three passes, takes seconds unoptimized:
# its crates are built optimized in debug and test builds too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# `wanderbooks update` hashes and verifies a whole program (P11a); its
# tests do it over a debug build's hundreds of megabytes.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.minisign]
opt-level = 3

[profile.dev.package.minisign-verify]
opt-level = 3

# The program that ships in the packages (P11a): symbols stripped, so the
# AppImage, .deb and .rpm are not carrying debug tables.
[profile.release]
strip = "symbols"
