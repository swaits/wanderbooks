# What cargo-about may report when it writes THIRD-PARTY-NOTICES.txt
# (`just notices`). The accepted list is deny.toml's `allow` list, word for
# word: the gate and the notices describe the same set of licences. A
# licence that is not here is not in the program either; if cargo-about
# meets one, fix the dependency, never this list.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "bzip2-1.0.6",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

# Every platform the program ships on. The list is fixed rather than the
# build machine's, so the notices name the same dependencies everywhere.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Only what the binary links: a build script's dependencies and the tests'
# are not shipped, so their licences have no notice to travel with.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The workspace's own crates are `publish = false`: they are the program,
# not third parties, and the program's own licence is stated at the top of
# the notices.
private = { ignore = true }
