[package]
name = "bookspec-checker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "bookspec's example schema, its rule identifiers and the Engine trait an accounting engine implements."

[dependencies]
serde = { version = "1", features = ["derive"] }
