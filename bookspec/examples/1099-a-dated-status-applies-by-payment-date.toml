id = "1099-a-dated-status-applies-by-payment-date"
title = "A payee's 1099 status applies to each payment as of the payment's date"
rule = """
Whether a payee is exempt (a corporation) is judged as of each payment: the
payer may treat a payee as a corporation when the condition is met before
the payment is made. An LLC that elects to be taxed as a corporation keeps
its EIN and becomes a corporation on the election's effective date (the
date its Form 8832 specifies). Payments before that date count toward its
1099-NEC; payments from it on are payments to a corporation, for which no
return is required. (A payee that incorporates is a new legal person: a new
payee, with its own W-9.)
"""
status = "AUTHORITY"
sources = [
  "Treas. Reg. §1.6041-3(p)(1) (docs/spec/sources/irs-1099-payment-method.md)",
  "Treas. Reg. §1.6049-4(c)(1)(ii)(A) (\"before a payment is made\")",
  "Treas. Reg. §301.7701-2(b)(2), §301.7701-3(c)(1)(iii)",
  "DECISION D-40 (wanderbooks owner, 2026-10-20): dated statuses",
]
tags = ["1099", "dated-status", "corporation", "election"]

[setup]
currency = "USD"
fiscal_year_start = "01-01"
basis = "cash"
rounding = "half-away-from-zero"
