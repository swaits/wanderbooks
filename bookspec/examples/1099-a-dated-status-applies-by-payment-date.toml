# By hand: before July 1, 1,500.00 + 1,000.00 = 2,500.00 counts (at least
# 2,000.00: reportable); from July 1 on, 800.00 + 1,200.00 = 2,000.00 paid
# to a corporation, not reportable.
[[expect]]
query = "vendor_1099"
payee = "Harbor Design LLC"
from = "2026-01-01"
to = "2026-12-31"
values = { status = "reportable", threshold = "2000.00", paid = "2500.00", excluded_card = "0.00", undetermined = "0.00", not_reportable = "2000.00" }
