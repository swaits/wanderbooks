id = "1099-a-members-check-through-financing-counts"
title = "A member's own check for the company counts toward the payee's 1099; their card doesn't; unknown stays unknown"
rule = """
The payer is the person who makes the payment in the course of its trade or
business. A person paying on another's behalf is the payer only if it
performs management or oversight functions or has a significant economic
interest; writing checks at another's direction is neither. A member who
pays a company bill from their own funds at the company's direction, the
company bearing the cost through its liability to the member, leaves the
company the payer: the member's check counts toward the payee's 1099. The
member's personal card is a payment card: excluded (Form 1099-K). A
member's payment whose method isn't recorded is undetermined, never
guessed; the payee is reportable only if what certainly counts reaches the
threshold.
"""
status = "AUTHORITY"
sources = [
  "Treas. Reg. §1.6041-1(a)(1)(i), (e)(1) (docs/spec/sources/irs-1099-payment-method.md)",
  "Treas. Reg. §1.6041-1(a)(1)(iv)",
  "26 U.S.C. §6041(a), as amended by Pub. L. 119-21 §70433 (docs/spec/sources/irs-1099-thresholds.md)",
]
tags = ["1099", "financing", "member-paid", "instruments"]

[setup]
currency = "USD"
fiscal_year_start = "01-01"
basis = "cash"
rounding = "half-away-from-zero"
cash_accounts = ["1000"]
