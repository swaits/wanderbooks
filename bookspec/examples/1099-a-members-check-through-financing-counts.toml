# By hand: counts 2,500.00 (the member's check); excluded 800.00 (their
# card); undetermined 300.00. What certainly counts, 2,500.00, is at least
# 2,000.00 however the 300.00 turns out: reportable, on 2,500.00 (or
# 2,800.00 once the 300.00 is known to be a check).
[[expect]]
query = "vendor_1099"
payee = "Dana Studio"
from = "2026-01-01"
to = "2026-12-31"
values = { status = "reportable", threshold = "2000.00", paid = "2500.00", excluded_card = "800.00", undetermined = "300.00", not_reportable = "0.00" }
