# By hand, March. Operating: entry 2, -120.00, and entry 4, -45.00 (cash
# paid to suppliers, 45-17(b), by the member for the company): -165.00;
# entries 5 and 6 net out. Investing: entry 3, -2,400.00 (equipment,
# 45-13(c), paid by the bank). Financing: entry 1 +1,000.00 and entry 4
# +45.00 (contributions, 45-14(a)), entry 2 +120.00 and entry 3 +2,400.00
# (borrowing, 45-14(b)), entry 7 -120.00 and entry 8 -200.00 (repayments,
# 45-15(b)): +3,245.00. Sum -165.00 - 2,400.00 + 3,245.00 = +680.00, the
# change in cash (1,000.00 - 120.00 - 200.00). Net income -165.00 equals
# operating: no reconciling item. Nothing is disclosed: no part of any
# entry went unsettled.
[[expect]]
query = "cash_flow"
from = "2026-03-01"
to = "2026-03-31"

