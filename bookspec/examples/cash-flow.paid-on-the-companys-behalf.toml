id = "cash-flow.paid-on-the-companys-behalf"
title = "A member and a lender pay for the company directly; the member is repaid"
rule = "When a member or a lender pays a company expense or purchase directly, with no cash account moving, the statement of cash flows MUST show a financing inflow (borrowed from the member or lender, or contributed when the member's capital is credited for an expense) and the operating or investing outflow, both on that payment's date; repaying the member or lender MUST be a financing outflow; such a payment and its reversal MUST net out together."
# CHOICE: ASC 230 does not address cash a third party pays on the entity's
# behalf. The firm guides present it by substance as a constructive
# receipt and disbursement (PwC 6.9.3.1; Deloitte 7.2, Example 7-2, a
# lender paying an insurer; BDO 3.4, Example 3-5, a bank paying the
# supplier of equipment, and a parent paying a subsidiary's expenses),
# and the owner chose that (wanderbooks D-42). KPMG also accepts a noncash
# presentation for equipment a lender pays for.
status = "CHOICE"
sources = [
  "ASC 230-10-45-13(c)",
  "ASC 230-10-45-14(a)",
  "ASC 230-10-45-14(b)",
  "ASC 230-10-45-15(b)",
  "ASC 230-10-45-17(b)",
  "PwC Viewpoint, Financial statement presentation 6.9.3.1 (cash a third party receives or pays on the entity's behalf is included as though through the entity's accounts)",
  "Deloitte Roadmap, Statement of cash flows 7.2 (constructive receipt and disbursement; Example 7-2)",
  "BDO Blueprint, Statement of cash flows under ASC 230 (December 2025) 3.4 and Example 3-5",
  "EY Financial reporting developments, Statement of cash flows (July 2026) 4.6.2 and 5.3.1",
  "wanderbooks D-42 (owner, 2026-10-20: a member or lender paying for the company is cash borrowed and spent)",
]
tags = ["accrual", "book", "us", "cash-flow", "constructive", "partnership"]

