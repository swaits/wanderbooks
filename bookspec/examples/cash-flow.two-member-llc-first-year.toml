# By hand, the year to 2026-03-31 (rules.md B-14; D-42 for what the
# members paid). Cash is 1000; 2100 (Due to Members) is financing.
# - Operating: the members paid #1 85.00, #2 12.97, #3 99.00, #6 7.49,
#   #21 216.40, #7 129.00 and #20 46.38 (the prepaid domain) for the
#   company through 2100, each borrowed (financing, 45-14(b)) and spent
#   (operating, 45-17(b)) on its date: 85.00 + 12.97 + 99.00 + 7.49 +
#   216.40 + 129.00 + 46.38 = 596.24, so operating -596.24, all cash paid
#   to suppliers. #9 and its reversal #22 net out (rule 6). The card's #10
#   and #23 moved no cash and 2050 is not financing: no line.
# - Investing 0.00: every device was property the members owned (50-4),
#   disclosed below; #12/#13 and #15/#18 net out.
# - Financing: #4 +1,200.00 and #5 +800.00 (contributions, 45-14(a));
#   +596.24 borrowed from the members (the seven above); the
#   reimbursements #8 -333.46 (#1, #2, #3, #6 and #7: 85.00 + 12.97 +
#   99.00 + 7.49 + 129.00) and #11 -46.38 (#20), 45-15(b): 1,200.00 +
#   800.00 + 596.24 - 333.46 - 46.38 = +2,216.40.
# - Sum: -596.24 + 0.00 + 2,216.40 = +1,620.16, the change in cash (in
#   1,200.00 + 800.00, out 333.46 + 46.38; 0.00 to 1,620.16); difference
#   0.00.
# - Reconciliation (45-28 to 45-30): net income is minus the expenses,
#   85.00 + 12.97 + 99.00 + 7.49 + 129.00 + 46.38 - 46.38 + 14.20 + 216.40
#   + 42.75 = 606.81, so -606.81; other noncash +39.00 (#19's service
#   plan, contributed with the laptop); increase in 1300, 39.00 + 46.38,
#   so -85.38; increase in 2050, 14.20 + 42.75, so +56.95. Total -606.81 +
#   39.00 - 85.38 + 56.95 = -596.24, the operating section.
# - Disclosed (50-3, 50-4), the property contributed: #14 1,480.00, #16
#   2,210.00, #17 630.00, #19 1,190.00 (1,151.00 equipment and 39.00 a
#   prepaid service plan), 5,510.00 in all; #12/#13 and #15/#18 drop out.
[[expect]]
query = "cash_flow"
from = "2026-01-01"
to = "2026-03-31"

[expect.values]
operating = "-596.24"
investing = "0.00"
financing = "2216.40"
net_change = "1620.16"
cash_beginning = "0.00"
cash_ending = "1620.16"
difference = "0.00"
net_income = "-606.81"
"operating.1" = "-85.00"
"operating.2" = "-12.97"
"operating.3" = "-99.00"
