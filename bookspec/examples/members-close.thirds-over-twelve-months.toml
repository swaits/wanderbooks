id = "members-close.thirds-over-twelve-months"
title = "Three members at a third each, twelve monthly closes"
rule = "Each monthly close to the members MUST give each member their largest-remainder split of everything closed so far, to the minor unit, less what earlier closes gave them, so after every close each member's total is less than one minor unit from their exact share."
status = "CHOICE"
sources = [
  "26 U.S.C. §704(a)",
  "Treas. Reg. §1.704-1(b)(2)(iv)(b)",
  "DECISION (owner, 2026-10-13: largest remainder; D-10, 2026-10-16: counted from the first close) (wanderbooks rules.md B-13)",
]
tags = ["partnership", "close", "rounding", "book", "us"]

# A third each can't be written as decimal shares summing to one, so the
# members hold 33.33%, 33.33% and 33.34%. Twelve months, each closed to
# them: 100.00, 0.01, 0.02, 33.33, -0.05, 0.10, 1.00, 0.07, 0.01, 12.34,
# -5.00, 0.02 (141.85 in all).
#
# By hand, from the rule (the running total, its exact shares, the floors
# to the cent, then the left-over cents to the largest remainders):
#   January, 100.00: 33.33 / 33.33 / 33.34 exactly.
#   February, running 100.01: 33.333333 / 33.333333 / 33.343334; floors
#     33.33 / 33.33 / 33.34 leave a cent for the largest remainder, C's
#     .003334: 33.33 / 33.33 / 33.35, so February gives C 0.01.
#   March, running 100.03: 33.339999 / 33.339999 / 33.350002; floors 33.33
#     / 33.33 / 33.35 leave two cents for A's and B's .009999: 33.34 /
#     33.34 / 33.35, so March gives A 0.01 and B 0.01.
#   November, running 141.83: 47.271939 / 47.271939 / 47.286122; floors
#     47.27 / 47.27 / 47.28 leave a cent for C's .006122: 47.27 / 47.27 /
#     47.29.
#   December, running 141.85: 47.278605 / 47.278605 / 47.29279; floors
#     47.27 / 47.27 / 47.29 leave two cents for A's and B's .008605: 47.28
#     / 47.28 / 47.29, so December gives A 0.01 and B 0.01.

[setup]
currency = "USD"
fiscal_year_start = "01-01"
basis = "accrual"
rounding = "largest-remainder"

[[setup.accounts]]
code = "1000"
name = "Cash"
type = "asset"

[[setup.accounts]]
code = "3000"
name = "Capital, A"
type = "equity"

[[setup.accounts]]
code = "3001"
name = "Capital, B"
type = "equity"

[[setup.accounts]]
code = "3002"
name = "Capital, C"
type = "equity"

[[setup.accounts]]
code = "4000"
name = "Sales"
type = "revenue"

[[setup.accounts]]
code = "6000"
name = "Fees"
type = "expense"

[[setup.members]]
name = "A"
capital_account = "3000"
share = "0.3333"

[[setup.members]]
name = "B"
capital_account = "3001"
share = "0.3333"

[[setup.members]]
name = "C"
capital_account = "3002"
share = "0.3334"

