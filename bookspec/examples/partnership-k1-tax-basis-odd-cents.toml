# B-36 with D-38: the tax-basis K-1's odd cents run cumulatively.
id = "partnership-k1-tax-basis-odd-cents"
title = "Tax-basis capital: odd cents of contributed property's basis split cumulatively"
rule = "Within each contribution, the property's built-in gain or loss (value less adjusted tax basis) is shared among the members as its book value is; to the cent, each member's running share from the books' first entry MUST be the largest-remainder rounding of their exact running share (ties to the member listed first), less what earlier entries gave them, so no member's share is ever a cent from exact and tied odd cents alternate instead of piling up on one member."
status = "CHOICE"
sources = [
  "Instructions for Form 1065 (2025), Item L, Tax-basis method: Capital contributed during the year",
  "26 U.S.C. §723",
  "Treas. Reg. §1.704-1(b)(2)(iv)(b)",
  "DECISION D-38 (owner, 2026-10-20): odd cents everywhere alike, cumulative largest remainder; applied to the tax-basis K-1 by the owner, 2026-10-22 (wanderbooks rules.md B-36, B-13)",
]
tags = ["partnerships", "k1", "tax-basis", "rounding"]

[setup]
currency = "USD"
fiscal_year_start = "01-01"
basis = "accrual"
rounding = "largest-remainder"
cash_accounts = ["1000"]

[[setup.accounts]]
code = "1000"
name = "Bank"
type = "asset"

[[setup.accounts]]
code = "1500"
name = "Equipment"
type = "asset"

[[setup.accounts]]
code = "1510"
name = "Accumulated Depreciation"
type = "asset"

[[setup.accounts]]
code = "3000"
name = "Capital, Tobin Harlow"
type = "equity"

[[setup.accounts]]
code = "3001"
name = "Capital, Morgan Ellis"
type = "equity"

[[setup.accounts]]
code = "6200"
name = "Depreciation Expense"
type = "expense"

[[setup.members]]
name = "Tobin Harlow"
capital_account = "3000"
share = "0.5"

[[setup.members]]
name = "Morgan Ellis"
capital_account = "3001"
share = "0.5"

# Three items the members contribute jointly, each from personal use and
# each worth less than its adjusted basis by an odd number of cents.
[[setup.assets]]
id = "monitor"
description = "Monitor"
cost = "400.00"
salvage = "0.00"
life_months = 24
in_service = "2026-01-01"
method = "straight_line"
cost_account = "1500"
accumulated_account = "1510"
expense_account = "6200"
acquired_by = 1
basis = { rule = "personal_use_conversion", contributor_adjusted_basis = "412.37", fmv_at_contribution = "400.00", sec704c_method = "traditional" }

[[setup.assets]]
id = "chair"
description = "Chair"
cost = "250.00"
salvage = "0.00"
