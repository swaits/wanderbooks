# By hand, the built-in loss shared as it runs (exact shares in brackets):
#   Monitor, -12.37: running -12.37 (-6.185 each); rounded toward zero
#     -6.18 each, a cent short, the remainders tie, the cent to Tobin:
#     Tobin -6.19, Morgan -6.18.
#   Chair, -13.41: running -25.78 (-12.89 each, exact): Tobin -12.89 less
#     -6.19 given = -6.70; Morgan -12.89 less -6.18 = -6.71.
#   Desk, -55.91: running -81.69 (-40.845 each): tied again, to Tobin:
#     Tobin -40.85 less -12.89 = -27.96; Morgan -40.84 less -12.89 =
#     -27.95.
# Year: built-in loss Tobin -40.85, Morgan -40.84; book property 625.00
# each; tax property 625.00 + 40.85 = 665.85 and 625.00 + 40.84 = 665.84,
# a cent apart. Shared entry by entry (each entry's tied cent to Tobin)
# it was -40.86 / -40.83: 665.86 against 665.83, three cents apart.
[[expect]]
query = "k1_tax_basis"
from = "2026-01-01"
to = "2026-12-31"
values = { "Tobin Harlow.contributions_property" = "665.85", "Tobin Harlow.known_ending" = "665.85", "Morgan Ellis.contributions_property" = "665.84", "Morgan Ellis.known_ending" = "665.84" }

[[expect]]
query = "k1_reconciliation"
from = "2026-01-01"
to = "2026-12-31"
values = { "Tobin Harlow.beginning" = "0.00", "Tobin Harlow.built_in_gain_704c" = "-40.85", "Tobin Harlow.property_without_basis" = "0.00", "Tobin Harlow.property_distributed" = "0.00", "Tobin Harlow.total" = "-40.85", "Morgan Ellis.beginning" = "0.00", "Morgan Ellis.built_in_gain_704c" = "-40.84", "Morgan Ellis.property_without_basis" = "0.00", "Morgan Ellis.property_distributed" = "0.00", "Morgan Ellis.total" = "-40.84" }

# From June the count runs on from January: the beginning is January to
# May's ending, open (the monitor's tax depreciation is the preparer's),
# known so far Tobin 200.00 + 6.19 = 206.19, Morgan 206.18; the span
# takes the chair's and the desk's parts, -6.70 - 27.96 = -34.66 and
# -6.71 - 27.95 = -34.66: tax property 425.00 + 34.66 = 459.66 each, the
# ending the year's.
[[expect]]
query = "k1_tax_basis"
from = "2026-06-01"
to = "2026-12-31"
values = { "Tobin Harlow.beginning" = "open", "Tobin Harlow.known_beginning" = "206.19", "Tobin Harlow.contributions_property" = "459.66", "Tobin Harlow.known_ending" = "665.85", "Morgan Ellis.beginning" = "open", "Morgan Ellis.known_beginning" = "206.18", "Morgan Ellis.contributions_property" = "459.66", "Morgan Ellis.known_ending" = "665.84" }
