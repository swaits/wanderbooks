[package]
name = "ledger-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wanderbooks: the one executable (viewer, books server, host, agents' bridge, owner's commands)."

[[bin]]
name = "wanderbooks"
path = "src/main.rs"

[features]
default = ["gui"]
# The viewer. Off in the server-only build for another machine (plan
# D-22, P9), so a headless machine carries no window libraries.
gui = ["dep:ledger-gui"]

[dependencies]
ledger-host = { path = "../ledger-host" }
ledger-mcp = { path = "../ledger-mcp" }
ledger-store = { path = "../ledger-store" }
ledger-gui = { path = "../ledger-gui", optional = true }

[dev-dependencies]
base64 = "0.22"
chrono = "0.4"
# Every test that drives the books server's tools: the CPA package they
# open, the outputSchemas they check against, the random cases, and the
# database read_only_tools_change_nothing compares by its rows.
jsonschema = { version = "0.58", default-features = false }
libc = "0.2"
proptest = "1"
reqwest = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = "1"
rmcp = { version = "3", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ledger-config = { path = "../ledger-config" }
ledger-core = { path = "../ledger-core" }
ledger-package = { path = "../ledger-package" }
ledger-import = { path = "../ledger-import" }
ledger-vault = { path = "../ledger-vault" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = "9.0.1"
minisign = "0.10.0"

[lints]
workspace = true

# The .rpm (P11a step 3), built by cargo-generate-rpm from the release
# program: `just package-linux`. Paths are relative to the workspace root.
[package.metadata.generate-rpm]
name = "wanderbooks"
summary = "Double-entry bookkeeping your agent keeps and you can read"
license = "MIT OR Apache-2.0"
url = "https://wanderbooks.ai"
assets = [
  { source = "target/release/wanderbooks", dest = "/usr/bin/wanderbooks", mode = "0755" },
  { source = "deploy/packaging/install-method-rpm", dest = "/usr/share/wanderbooks/install-method", mode = "0644" },
  { source = "deploy/packaging/wanderbooks-static.desktop", dest = "/usr/share/applications/wanderbooks.desktop", mode = "0644" },
]
