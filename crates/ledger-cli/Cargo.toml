[package]
name = "ledger-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wanderbooks CLI: one command from nothing to a working books directory."

[[bin]]
name = "wanderbooks"
path = "src/main.rs"

[features]
default = ["gui"]
# The viewer. Off in the server-only build for another machine (plan
# D-22, P9), so a headless machine carries no window libraries.
gui = ["dep:ledger-gui"]

[dependencies]
ledger-mcp = { path = "../ledger-mcp" }
ledger-store = { path = "../ledger-store" }
ledger-gui = { path = "../ledger-gui", optional = true }

[dev-dependencies]
chrono = "0.4"
ledger-config = { path = "../ledger-config" }
ledger-core = { path = "../ledger-core" }
serde_json = "1"
toml = "1"
tempfile = "3"

[lints]
workspace = true
