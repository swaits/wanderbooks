[package]
name = "ledger-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Company settings for wanderbooks: an older books dir's wanderbooks.toml, read at adoption."

[dependencies]
ledger-core = { path = "../ledger-core" }
chrono = "0.4"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
