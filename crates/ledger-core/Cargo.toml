[package]
name = "ledger-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical double-entry bookkeeping semantics: the engine everything else is built on."

[dependencies]
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# company.timezone: IANA names, with the zone database built in so every
# computer reads a name the same way.
jiff = { version = "0.2.35", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"
# bookspec examples are TOML (tests/bookspec.rs).
toml = "1"

[[bench]]
name = "books"
harness = false
