[package]
name = "ledger-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only, live desktop view of wanderbooks books."

[[bin]]
name = "ledger-gui"
path = "src/main.rs"

[dependencies]
ledger-core = { path = "../ledger-core" }
ledger-store = { path = "../ledger-store" }
ledger-config = { path = "../ledger-config" }
ledger-import = { path = "../ledger-import" }
ledger-vault = { path = "../ledger-vault" }
ledger-package = { path = "../ledger-package" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "datepicker", "serde"] }
egui-phosphor = "0.14"
# Markdown documents, drawn as text. No image loading (no `load-images`,
# no `fetch`): a document never makes the viewer read a file or the network.
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
notify = "8"
jiff = "0.2"
chrono = "0.4"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# The dock: a terminal emulator over a PTY (ConPTY on Windows), P11b
alacritty_terminal = "0.26"

[dev-dependencies]
chrono = "0.4"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
proptest = "1"
tempfile = "3"
zip = "9.0.1"

[lints]
workspace = true
