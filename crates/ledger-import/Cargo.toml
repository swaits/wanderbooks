[package]
name = "ledger-import"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ledger-core = { path = "../ledger-core" }
csv = "1"
rust_decimal = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rust_xlsxwriter = "0.90"
typst-as-lib = { version = "0.17", default-features = false }
typst-pdf = "0.15.1"
typst = "0.15.1"
serde_json = "1"
typst-layout = "0.15.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# BSD-3-Clause: the IIF's transliteration to ASCII (iif.rs, rules.md B-34).
# Pinned exactly: a new table would change what a CPA's file says.
deunicode = { version = "=1.6.0", default-features = false }

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
# The viewer's PDF reader (ledger-gui's hayro): reads back the text a PDF
# draws, glyph by glyph, in the tests.
hayro-interpret = "0.8"
kurbo = "0.13"
rqrr = { version = "0.11.0", default-features = false }
