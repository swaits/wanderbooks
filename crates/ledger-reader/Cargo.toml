[package]
name = "ledger-reader"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The one reader: a PDF's text and pages, an XLSX's cells as exact decimal strings (plan P6, D-61)."

[dependencies]
thiserror = "2"
# Extraction (plan P6): a PDF's text, a page's pixels, an XLSX's cells.
# hayro (the renderer) and hayro-interpret (the text interpreter) are pure
# Rust and already the viewer's PDF reader, so the server and the viewer
# read a receipt through one implementation rather than two; `zip` and
# `quick-xml` read a spreadsheet's XML. None of them touches money: a
# number is kept as the decimal string the XML holds.
hayro = { version = "0.8", features = ["embed-fonts"] }
hayro-interpret = "0.8"
kurbo = "0.13"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
quick-xml = "0.38"

[lints]
workspace = true
