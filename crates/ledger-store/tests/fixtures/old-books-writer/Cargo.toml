# The harness that wrote tests/fixtures/old-books, through the Store API of
# the version that wrote them (main 188c90ea, 2026-10-17), and that version's
# expected.json (bin/expect). Not a workspace member: point the two paths at
# a checkout of the writing version (`git archive 188c90ea | tar -x -C
# wb-main`), then
#   cargo run --bin writer -- OUT     (the P0 review's thirteen and control)
#   cargo run --bin extras -- OUT     (the edges of chrono and Decimal)
#   cargo run --bin extras2 -- OUT    (depreciation for 10000-01; 1,044 drafts)
#   cargo run --bin older -- OUT      (x_older_rules, with its JournalWriter)
#   cargo run --bin s5_before -- OUT   (p4_s5_before: run against eeee9658,
#                                      the revision before P4b S5)
#   cargo run --bin p2_1099 -- OUT    (p2_vendor_1099: P2's 1099 marks, run
#                                      against 9c99a0cf, the revision before P3)
#   cargo run --bin expect -- OUT     (expected.json beside each journal)
# and copy each journal.jsonl, blobs/ and expected.json into old-books/.
# x_member_closes was written later, the same way, by main 00226a4c
# (2026-10-20, before P3's odd cent): `cargo run --bin members -- OUT`
# (members closes under every rounding rule main wrote; P3 review R-2).
[package]
name = "writer"
version = "0.1.0"
edition = "2024"

[dependencies]
ledger-core = { path = "wb-main/crates/ledger-core" }
ledger-store = { path = "wb-main/crates/ledger-store" }
chrono = "=0.4.45"
rust_decimal = "=1.43.0"
serde_json = "1"

[workspace]
# main's crates (wb-main) keep their own workspace.
exclude = ["wb-main"]
