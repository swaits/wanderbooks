[package]
name = "ledger-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wanderbooks' encrypted TIN vault: full taxpayer identification numbers and W-9 files, outside the journal"

[dependencies]
chacha20poly1305 = "0.11"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["serde"] }
base64 = "0.22"

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
