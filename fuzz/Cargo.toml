[package]
name = "ledger-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
serde = "1"
rust_decimal = "1"
chrono = "0.4"

[dependencies.ledger-core]
path = "../crates/ledger-core"

[dependencies.ledger-store]
path = "../crates/ledger-store"

[dependencies.ledger-import]
path = "../crates/ledger-import"

[dependencies.ledger-config]
path = "../crates/ledger-config"

[[bin]]
name = "fuzz_journal_line"
path = "fuzz_targets/fuzz_journal_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_entry_validate"
path = "fuzz_targets/fuzz_entry_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_op_sequence"
path = "fuzz_targets/fuzz_op_sequence.rs"
test = false
doc = false
bench = false

