# Everything needed to build, test, prove, and ship wanderbooks.
# `mise install` in this directory, then `just` lists the recipes.

[tools]
# Workspace toolchain (clippy and rustfmt for `just check`).
rust = [
  { version = "1.99", components = "clippy,rustfmt", targets = "x86_64-pc-windows-msvc" },
  # Fuzzing (cargo-fuzz), Miri and branch coverage need nightly; pinned so
  # runs repeat. `llvm-tools` is what cargo-llvm-cov reads profiles with.
  { version = "nightly-2026-10-01", components = "miri,rust-src,llvm-tools" },
]
just = "1"
# `just oracle` reads the pinned bookspec's path from `cargo metadata`.
jq = "1.7.1"
# `just deploy` runs the Netlify CLI through npx.
node = "26"
# `just prove`: Kani model-checks the accounting kernel. Kani fetches its
# own pinned nightly and CBMC under ~/.kani on first run.
"cargo:kani-verifier" = "0.68.0"
# `just prove`: Lean proves the accounting laws (bookspec's, required by
# verify/lean). Matches verify/lean/lean-toolchain.
"github:leanprover/lean4" = "4.34.1"
# Mutation testing and fuzzing (docs/oracle.md).
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-fuzz" = "0.13.2"
# `just coverage`: line and branch coverage of the core and the store
# (docs/coverage-floor.md).
"cargo:cargo-llvm-cov" = "0.9.1"
# A compile cache shared by every jj workspace's target dir: point
# cargo's build.rustc-wrapper at it (~/.cargo/config.toml).
sccache = "0.18.0"
# `just package-linux` (docs/packaging.md): the AppImage and .deb by
# cargo-packager, the .rpm by cargo-generate-rpm (D-25).
"cargo:cargo-packager" = "0.11.8"
"cargo:cargo-generate-rpm" = "0.21.1"
